<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Si no se proporciona el titulo, lo llamamos como PEC 3 de Bases de Datos-->
    <title>{% block title %}PEC 3: BB.DD{% endblock %}</title>

    <!-- Bootstrap y CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <!-- Añadir más estilos CSS (En caso de requerirse)-->
    {% block styles %}{% endblock %}
</head>
<body>
    <header class="navbar navbar-expand-lg bg-body-tertiary w-100 sticky-top shadow-sm">
            <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                PEC 3: Bases de Datos Avanzadas
            </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
                <ul class="nav nav-underline">
                    <li class="nav-item">
                        <a class="nav-link text-reset {{ 'active fw-bold text-dark' if request.path == '/' else '' }}" 
                        href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-reset {{ 'active fw-bold text-dark' if request.path.startswith('/profesores') else '' }}" 
                        href="/profesores">Profesores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-reset {{ 'active fw-bold text-dark' if request.path.startswith('/alumnos') else '' }}" 
                        href="/alumnos">Alumnos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-reset {{ 'active fw-bold text-dark' if request.path.startswith('/cursos') else '' }}" 
                        href="/cursos">Cursos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-reset {{ 'active fw-bold text-dark' if request.path.startswith('/matriculas') else '' }}" 
                        href="/matriculas">Matrículas</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
    
</body>
</html>
